; ---------------------------------------------------------------------------
; Enhanced Input is the only input path. The probe builds its InputActions and
; InputMappingContext in C++ at runtime (see AUniverseProbePawn::BuildInputAssets)
; rather than referencing assets, so the project stays free of committed
; binary content during the architecture sprints.
;
; These two lines are what make the engine hand the pawn an
; UEnhancedInputComponent instead of the legacy one; without them the probe's
; BindAction calls would never be reached.
; ---------------------------------------------------------------------------

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bCaptureMouseOnLaunch=True
bDefaultViewportMouseLock=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
