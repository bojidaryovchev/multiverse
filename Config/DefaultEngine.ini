; ---------------------------------------------------------------------------
; Sprint 001 runs entirely from code: there is no committed level asset and no
; committed content. The default map is an empty engine map and
; AUniverseGameMode builds the whole scene at StartPlay from the generator.
;
; That keeps a clean checkout buildable and runnable with source alone, and
; guarantees the test scene always reflects what the generator actually
; produces rather than a snapshot someone saved into a map.
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Universe.UniverseGameMode

[/Script/Engine.RendererSettings]
; Auto-exposure stays ON. Star illuminance is computed physically (see
; ComputeStarIntensityCandelas), so the scene spans an enormous dynamic range -
; 128,000 lux at 1 AU down to near-zero in interstellar space - which is
; precisely the case auto-exposure exists to handle. Pinning exposure instead
; was what made the first render come out black.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False

[/Script/Engine.Engine]
; The scene spans scaled-space distances of many kilometres; the default near
; clip would z-fight badly at that range.
NearClipPlane=10.0

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=A4EC95EA40D4AD844B97F88E735C08EC
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
